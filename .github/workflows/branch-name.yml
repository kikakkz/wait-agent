name: branch-name
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch prefix and title consistency
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'

          if [[ ! "$BRANCH" =~ ^($types)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "Branch '$BRANCH' must be '<type>/<issue>-<slug>'." >&2
            echo "Type must be one of: ${types//|/ }" >&2
            exit 1
          fi
          prefix_type="${BASH_REMATCH[1]}"

          title_re="^($types)(\\([a-z0-9-]+\\))?!?: .+"
          if [[ ! "$TITLE" =~ $title_re ]]; then
            echo "PR title '$TITLE' must be Conventional Commits format." >&2
            exit 1
          fi
          title_type="${BASH_REMATCH[1]}"

          if [[ "$prefix_type" != "$title_type" ]; then
            echo "Mismatch: branch prefix '$prefix_type/' vs PR title type '$title_type:'." >&2
            echo "Renaming the branch requires closing this PR and opening a new one" >&2
            echo "(GitHub cannot retarget a PR). If the title can move instead," >&2
            echo "edit the title; otherwise validate the next branch before" >&2
            echo "push with 'python3 .agents/tools/check_branch_name.py --title ...'." >&2
            exit 1
          fi
          echo "branch-name: OK ('$BRANCH' matches title type '$title_type')"
