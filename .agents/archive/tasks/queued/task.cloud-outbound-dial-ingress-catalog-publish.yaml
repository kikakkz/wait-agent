id: task.cloud-outbound-dial-ingress-catalog-publish
kind: task
version: 1
title: publish default local session catalog from ingress server for outbound-dial peers
status: done
priority: high
design_ref:
  doc: docs/reconnection-plan.md
  section: 3
  why:
    - When the control host dials a remote waitagent in outbound-dial mode, the remote daemon does not know which server to connect to, so it must publish its default local session directly from the ingress server.
    - This aligns outbound-dial first connect with manual waitagent --connect behavior.
source_of_truth:
  file: .agents/tasks/backlog.yaml
  reference: active
depends_on:
  - task.cloud-outbound-dial-operator-auth.done
linked_primitives:
  - primitive.verification-refresh
  - primitive.task-board-sync
done_criteria:
  - Outbound-dial remote daemon publishes its default local session through the ingress server catalog path.
  - Ctrl+W first connect to an outbound-dial peer activates that default session instead of creating a new one.
  - No duplicate sessions are created on repeated Ctrl+W.
  - cargo fmt --check and cargo clippy -- -D warnings pass.
verification:
  - cargo test remote_node_ingress_server_runtime -- --test-threads=1
  - cargo test remote_node_session_sync_runtime -- --test-threads=1
  - manual: Ctrl+W to an outbound-dial LAN host, verify first session is the default published one
  - cargo clippy -- -D warnings
touched_paths:
  - src/remote/node/remote_node_ingress_server_runtime.rs
  - src/remote/node/remote_node_session_sync_runtime.rs
  - src/remote/publication/ratatui_target_publication_backend.rs
  - src/ratatui_node/state_loop.rs
notes:
  - Shipped in v0.1.29.
  - This fix ensures parity between manual --connect and outbound-dial first-connect behavior.
