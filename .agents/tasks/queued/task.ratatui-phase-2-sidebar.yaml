id: task.ratatui-phase-2-sidebar
kind: task
version: 1
title: render real sidebar session catalog, navigation, and footer menu popup with ratatui
status: in_progress
priority: high
design_ref:
  doc: docs/ratatui-replace-tmux-plan.md
  section: 2
  why:
    - sidebar is the primary navigation surface for sessions in the ratatui path
    - footer menu popup replaces the tmux path's interactive footer menu for common actions
    - completing both surfaces makes the ratatui client self-sufficient for basic workspace operations
source_of_truth:
  file: .agents/tasks/queued/task.ratatui-phase-2-sidebar.yaml
  reference: queued
depends_on:
  - task.ratatui-phase-1-footer.done
done_criteria:
  - sidebar renders the real session catalog from the node server snapshot
  - each sidebar row shows session name and attached/detached status
  - sidebar supports Up/Down navigation and highlights the selected row
  - pressing Enter on a sidebar row attaches to that session
  - footer shortcut hints include Ctrl-M for the menu
  - Ctrl+M opens a popup menu with actions: New Session, Connect Remote Host, New Remote Session, Close Current Session, Quit Client, Error Log
  - selecting a menu item dispatches the corresponding command (or placeholder action for items not yet wired)
  - cargo fmt --check passes
  - cargo check passes
  - cargo build --bin waitagent succeeds
verification:
  - cargo fmt --check
  - cargo check
  - cargo build --bin waitagent
  - manual test: create sessions 1 and 2, navigate sidebar, switch session via Enter, open footer menu and select Quit Client
touched_paths:
  - src/runtime/ratatui_node_runtime.rs
  - src/runtime/ratatui_client_runtime.rs
  - src/runtime/ratatui_workspace_runtime.rs
  - src/cli.rs
  - src/command/dispatch.rs
notes:
  - Menu actions can start as workspace-level shell-outs (spawn waitagent subcommands) and later move to direct node-server RPC.
  - Keep the existing tmux path footer/menu untouched; this is ratatui-path only.
  - Phase 2 deliberately keeps the main pane as a placeholder; PTY integration is Phase 3.
