id: context.repo-map
kind: context
version: 1
summary:
  layout: repository structure most relevant to planning and execution
  freshness_note: >
    last refreshed 2026-10 during the issue-driven migration (AD-0001);
    the session-bootstrap skill verifies these anchors before trusting
    them — stale entries are reported, never silently followed
module_map:
  entrypoints:
    - path: src/main.rs
      responsibility: process entry, minimal wiring only
    - path: src/bootstrap.rs
      responsibility: top-level CLI bootstrap into the accepted default route
    - path: src/cli.rs
      responsibility: command-line parsing and public entrypoints
    - path: src/bin/
      responsibility: additional binaries
  runtime_core:
    - path: src/ratatui_node/
      responsibility: >
        ratatui-first workspace runtime core — local sessions, remote
        sessions, state event loop, node runtime, reconnect and outbound
        dial workers, clipboard pipeline, authority host/session IO, loom
        model tests
    - path: src/event.rs
      responsibility: internal runtime event bus
    - path: src/lifecycle.rs
      responsibility: runtime lifecycle ownership
    - path: src/terminal.rs
      responsibility: terminal raw mode and VT state handling
    - path: src/ui/
      responsibility: ratatui UI surfaces
  networking:
    - path: src/infra/remote_grpc_transport.rs
      responsibility: node-to-node transport session establishment (TCP dial path)
    - path: src/infra/peer_connection.rs
      responsibility: >
        PeerConnection transport seam — ordered, reliable, full-duplex
        byte stream below the node-to-node inner TLS; direct TCP impl,
        with the relay mux stream impl landed in relay_mux/ (#51)
    - path: src/infra/relay_mux/
      responsibility: >
        relay mux frame layer (issue #51): deterministic frame codec plus
        per-connection stream state machine (open/close/data/window,
        per-stream credit); MuxStream is a PeerConnection via blanket impl;
        lands ahead of its first consumer (node relay client), so
        infra/mod.rs carries a transitional #[allow(dead_code)]
    - path: src/infra/relay_server.rs
      responsibility: >
        relay listener/handle/config (issue #52): mTLS whitelist gate,
        accept loop, eviction sweeper, lifecycle events; per-link protocol
        and routing live in relay_link/relay_routing (files split to stay
        under the 1000-line cap)
    - path: src/infra/relay_link.rs
      responsibility: >
        per-link relay protocol loop (issues #53-#54, capacity admission
        #34): register/heartbeat lifecycle plus routing dispatch; TLS
        stream split into a reader task and a writer task pumping a bounded
        outbound queue, so cross-link forwarding couples TCP-like
        backpressure between the two legs of a routed stream
    - path: src/infra/relay_routing.rs
      responsibility: >
        stream routing table (issue #54): directional legs per routed
        stream with half-close bookkeeping, structured error codes
        (TARGET_UNKNOWN/STREAM_UNKNOWN/STREAM_CLOSED), teardown that
        notifies surviving peers with CloseStream
    - path: src/infra/relay_admin.rs
      responsibility: >
        relay local admin socket (issue #55): owner-only channel per the
        remote_ipc owner-control pattern; one-JSON-request protocol over
        RelayAdminContext (table + routing + listener + capacity + meter)
        with connection-table status, capacity/usage fields (#34), and
        graceful shutdown today; invite/remove land with the enrollment
        slice
    - path: src/infra/relay_capacity.rs
      responsibility: >
        single-relay capacity model (issue #34): RelayCapacityConfig
        (max_nodes/max_streams/max_throughput_bytes_per_sec with
        conservative placeholder defaults), UsageMeter 1s-window byte
        accounting, admit_register/admit_open admission decisions feeding
        the NODE_CAPACITY/STREAM_CAPACITY/THROUGHPUT_EXCEEDED structured
        rejections in relay_link
    - path: src/infra/relay_connection_table.rs
      responsibility: >
        memory-only node_id -> connection registry (issue #53):
        identity-guarded register/replace/touch/remove, heartbeat-timeout
        eviction (10s beats, 30s offline), lifecycle event channel
        (Registered/Replaced/Unregistered/EvictedOffline) as the test hook
  command_layer:
    - path: src/command/relay_serve.rs
      responsibility: >
        `waitagent relay serve` runtime: builds the gate config, runs it on
        a multi-thread runtime until killed; graceful signal shutdown lands
        with the admin socket slice (#55)
    - path: src/infra/node_credentials.rs
      responsibility: node device identity — self-signed cert + SPKI fingerprint
    - path: src/infra/operator_auth.rs
      responsibility: authorized_operators whitelist pattern (relay authorized_nodes/ follows it)
    - path: src/infra/remote_node_paths.rs
      responsibility: owner-control socket paths for local runtime ingress
    - path: src/host/ssh/
      responsibility: SSH remote host bootstrap, connect runtime, secret store
    - path: src/remote/
      responsibility: remote-session support modules outside the node runtime
  structure:
    - path: src/command/
      responsibility: command dispatch layer (relay subcommands land here)
    - path: src/application/
      responsibility: application services (transport-agnostic session catalog)
    - path: src/domain/
      responsibility: domain models (workspace, target catalog)
    - path: src/ports/
      responsibility: port traits and boundary interfaces
    - path: src/platform/
      responsibility: platform IPC and process abstractions (local_ipc, remote_ipc, wake_pipe)
    - path: src/process/
      responsibility: process spawning and ownership
    - path: src/process_monitor/
      responsibility: process supervision
design_docs:
  - path: docs/architecture.md
    responsibility: system architecture
  - path: docs/module-design.md
    responsibility: internal boundaries
  - path: docs/protocol.md
    responsibility: network protocol design
  - path: docs/relay-design.md
    responsibility: governing design for the current relay phase 1 milestone
  - path: docs/remote-node-connection-architecture.md
    responsibility: node connection and authority model
  - path: docs/reconnection-plan.md
    responsibility: reconnect policy for outbound-dial and inbound connect
  - path: docs/cloud-host-auth-design.md
    responsibility: cloud host control-plane authentication
  - path: docs/local-acceptance-checklist.md
    responsibility: local acceptance gate
archived:
  - path: docs/archive/
    responsibility: >
      historical boards and plans (execution-status-board, agents-control-plane,
      wait-agent-prd, functional-design, interaction-flows, ratatui-replace-tmux-plan);
      archaeology only, never a source of current truth
