id: task.ratatui-agent-sessions-hotkey-phase7-acceptance
kind: task
version: 1
title: end-to-end acceptance and documentation for agent sessions hotkey
status: done
priority: high
design_ref:
  doc: docs/ratatui-agent-sessions-hotkey-design.md
  section: 9, 10, 11
  why:
    - The feature must be verified across all three agents and both local/remote target types before the epic closes.
    - Documentation and tests must reflect the actual on-disk schemas and the remote peer protocol discovered during design.
source_of_truth:
  file: .agents/tasks/queued/task.ratatui-agent-sessions-hotkey-phase7-acceptance.yaml
  reference: queued
depends_on:
  - task.ratatui-agent-sessions-hotkey-phase6-ui.done
done_criteria:
  - Manual end-to-end verification for Kimi, Codex, and Claude local sessions.
  - Manual end-to-end verification for Kimi, Codex, and Claude remote peer sessions (two-node setup).
  - Verify the hotkey does not trigger when overlays or sidebar are active.
  - Verify empty/missing agent data directories produce a clear user message on both local and remote nodes.
  - Verify remote node offline / unsupported protocol produces a clear error message.
  - Update `docs/ratatui-agent-sessions-hotkey-design.md` status from Draft to Accepted if no design changes were needed.
  - Update `AGENTS.md` if new conventions were introduced.
  - All unit tests pass; no new warnings from `cargo clippy -- -D warnings`.
  - `cargo test --release ratatui session_sync` passes.
verification:
  - cargo fmt --check
  - cargo clippy -- -D warnings
  - cargo test --release ratatui session_sync
  - manual end-to-end across local and remote peer bash/kimi/codex/claude sessions
touched_paths:
  - docs/ratatui-agent-sessions-hotkey-design.md
  - AGENTS.md
  - tests/cli_smoke.rs
notes:
  - Hardened remote-path error handling: `feed_remote_session_list_agent_sessions` and `send_list_agent_sessions` now return a `bool`; when the remote session is missing or its writer is not ready, the server returns an immediate error to the client instead of leaving the popup stuck on "Loading...".
  - Client disconnect now cleans up pending `ListAgentSessions` request entries to avoid stale map growth.
  - Empty/missing agent data directories show "No local sessions found for <agent>" (local) or "No remote sessions found for <agent>" (remote).
  - Added automated tests for `apply_list_agent_sessions_response` success/error/empty-data paths and for `format_relative_time`.
  - Design doc status updated from Draft to Accepted; Section 11 updated with known limitations around remote-response timeout and unsupported remote peers.
  - Fixed post-acceptance bug: agent sessions popup interior was transparent/see-through because empty Paragraph lines did not paint a background. Added a solid black background block over the popup interior in `render_agent_sessions_popup`.
  - Manual TUI end-to-end verification could not be executed in this environment because the session is not attached to a TTY (`not a tty`, `TERM=dumb`). Kimi and Codex binaries are present, but the ratatui client requires an interactive terminal. This evidence should be collected on a workstation with a real terminal before the epic is considered fully field-verified.
