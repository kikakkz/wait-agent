version: 1
kind: agent_control_plane
read_order:
  - .agents/AGENTS.md
  - .agents/context/project.yaml
  - .agents/context/constraints.yaml
  - .agents/context/repo-map.yaml
  - .agents/decisions/README.md
read_on_demand:
  - .agents/decisions/AD-0001-issue-driven-task-source.md
  - .agents/decisions/AD-0002-relay-phase-1-design.md
  - .agents/context/generated-artifacts.yaml
entrypoints:
  default_task: null
  default_runbook: null
  next_task_runbook: null
  self_maintenance_runbook: null
authoritative_sources:
  operating_contract: AGENTS.md
  relay_design: docs/relay-design.md
  architecture: docs/architecture.md
  protocol: docs/protocol.md
  human_overview: docs/agents-control-plane.md
required_rules:
  - Read AGENTS.md before exploring the repo; it is the operating contract.
  - Task state lives in GitHub issues (AD-0001). Never recreate a local task board.
  - Work starts by finding or filing the issue; branches are named per the issue.
  - Keep decision records in .agents/decisions/ when a decision is made; keep human-facing rationale in docs/.
  - Treat .agents/archive/ as read-only history.
directories:
  decisions: .agents/decisions
  tools: .agents/tools
  context: .agents/context
  archive: .agents/archive
active_context:
  project_phase: relay-phase-1
  current_stage: issue-driven migration complete; relay implementation is the first issue-driven batch
  current_focus: relay phase 1 — see the "relay phase 1" milestone on GitHub
