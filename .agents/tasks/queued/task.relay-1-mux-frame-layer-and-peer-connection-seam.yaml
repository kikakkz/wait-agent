done_criteria:
  - PeerConnection abstraction (ordered, reliable, full-duplex byte stream)
    defined at the node dial boundary.
  - Mux frame layer implemented with stream open/close/data/window frames
    multiplexed over one connection.
  - Existing direct TCP dial in src/infra/remote_grpc_transport.rs folded
    behind the PeerConnection seam with byte-identical behavior.
  - No changes to node-to-node inner TLS, AuthorityTransport, ControlPlane,
    or session protocols.
  - All existing session and transport tests pass unchanged.
