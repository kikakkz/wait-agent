status: backlog
priority: high
design_ref:
  doc: docs/relay-design.md
  section: 架构, 协议分层
  why:
    - Phase 1 task split item 1 the node-to-node TCP dial must become a
      pluggable ordered reliable duplex byte stream (PeerConnection) so a
      relay stream can become a second implementation without touching any
      session protocol.
    - Direct TCP is folded behind the same seam with byte-identical behavior.
