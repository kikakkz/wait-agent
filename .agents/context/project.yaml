id: context.project
kind: context
version: 1
summary:
  product: WaitAgent
  repo_type: single_crate_rust_repo
  language: rust
  package_manager: cargo
  architecture_style: ratatui_first_workspace_runtime_with_remote_nodes
  active_business_goal: >
    cross-site host interconnect through a self-hosted relay (relay phase 1,
    governed by docs/relay-design.md and .agents/decisions/AD-0002); the
    ratatui-first local runtime and the remote node networking it builds on
    are complete and in maintenance
  framework_policy: >
    prefer mature maintained Rust components over custom infrastructure, and
    avoid weakly maintained dependencies across the codebase
task_source:
  tracker: github_issues
  policy: see .agents/decisions/AD-0001 — no issue, no code; branches are
    named <type>/<issue>-<slug> and every PR closes its issue
current_phase:
  phase_id: relay-phase-1
  phase_title: relay phase 1 (CS star topology, self-hosted)
  stage_id: relay-1-error-semantics
  stage_title: structured relay error semantics relay to node to console (issue #36)
current_focus:
  default_task_id: "#36"
  focus_statement: >
    land structured relay error semantics end to end (relay -> node ->
    console), reusing the #32 presence channel; investigate #105 (relay
    close-cascade stall under scheduler backpressure) before or during
    this slice — it touches the same teardown paths; the #35 config
    surface (relay.toml both sides, remote-hosts via selector, Ctrl-W
    relay dial path) is merged (PRs #104 and #107)
upcoming_focus:
  - e2e suite: docker two-node / concurrent sessions (issue #37)
  - WebUI console (issue #38)
source_of_truth:
  - AGENTS.md
  - docs/relay-design.md
  - .agents/decisions/README.md
  - docs/architecture.md
  - docs/protocol.md
  - docs/remote-node-connection-architecture.md
  - docs/local-acceptance-checklist.md
