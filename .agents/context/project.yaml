id: context.project
kind: context
version: 1
summary:
  product: WaitAgent
  repo_type: single_crate_rust_repo
  language: rust
  package_manager: cargo
  architecture_style: ratatui_first_local_workspace_runtime
  active_business_goal: replace tmux with ratatui as the local workspace UI substrate while preserving distributed session capabilities
  framework_policy: prefer mature maintained Rust components over custom infrastructure, and avoid weakly maintained dependencies across the codebase
current_phase:
  phase_id: phase-3
  phase_title: ratatui-first workspace runtime
  stage_id: ratatui-footer-state
  stage_title: migrate the footer status bar to a real ratatui widget backed by node-server state
current_focus:
  default_task_id: task.ratatui-phase-1-footer
  focus_statement: render the footer status bar with real session state in the ratatui client, building on the phase-0 server/client skeleton
upcoming_focus:
  - migrate footer state bar to ratatui widget
  - migrate sidebar session catalog and navigation to ratatui
  - implement main pane PTY with alacritty_terminal
  - remove tmux backend once ratatui path is feature-complete
  - activate distributed control topologies on the server/client foundation
source_of_truth:
  - docs/ratatui-replace-tmux-plan.md
  - docs/execution-status-board.md
  - docs/remote-network-completion-plan.md
  - docs/remote-node-connection-architecture.md
  - docs/local-acceptance-checklist.md
  - docs/architecture.md
  - docs/functional-design.md
