[package]
name = "waitagent"
version = "0.1.56"
edition = "2021"
description = "Terminal-native interaction scheduler for multi-agent workflows"
homepage = "https://github.com/kikakkz/wait-agent"
repository = "https://github.com/kikakkz/wait-agent"
license = "MIT"
keywords = ["terminal", "multiplexer", "workspace", "agent"]
categories = ["command-line-utilities"]

[package.metadata.deb]
maintainer = "kikakkz <kikakkz@users.noreply.github.com>"
depends = "libevent-2.1-7 | libevent-2.1-6, libncurses6 | libncurses5"
section = "utils"
priority = "optional"

[package.metadata.generate-rpm]
vendor = "WaitAgent"
summary = "Terminal-native interaction scheduler for multi-agent workflows"
requires = "libevent, ncurses-libs"

[dependencies]
aes = "0.9"
base64 = "0.22"
cbc = "0.2"
# image-data enables binary clipboard (image) reads; pin image to 0.25.9 because
# 0.25.10 requires Rust 1.88.0 while the project toolchain is pinned to 1.86.0.
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "=0.25.9", default-features = false }
crossbeam-channel = "0.5"
crossterm = { version = "0.27.0", features = ["bracketed-paste"] }
getrandom = "0.4"
rand_core = "0.10"
hmac = "0.13"
pbkdf2 = "0.13"
polling = "3.11"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
ratatui = { version = "0.27.0", default-features = false, features = ["crossterm"] }
rcgen = "0.12"
russh = "0.61.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa", "encryption"] }
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "1"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
tower = "0.4"
hyper-util = "0.1"
unicode-width = "0.1.14"
alacritty_terminal = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["termios"] }
rustix-openpty = "0.2"
signal-hook = "0.3"
keyring = { version = "3", features = ["linux-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
] }

[features]
# Enable to compile the loom model tests in src/ratatui_node/loom_tests.rs.
# Requires adding `loom` as a dev-dependency.
loom_test = []

[build-dependencies]
cc = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
protoc-bin-vendored = "3"
tonic-build = "0.12"
