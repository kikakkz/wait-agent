id: context.project
kind: context
version: 1
summary:
  product: WaitAgent
  repo_type: single_crate_rust_repo
  language: rust
  package_manager: cargo
  architecture_style: ratatui_first_workspace_runtime_with_remote_nodes
  active_business_goal: >
    cross-site host interconnect through a self-hosted relay (relay phase 1,
    governed by docs/relay-design.md and .agents/decisions/AD-0002); the
    ratatui-first local runtime and the remote node networking it builds on
    are complete and in maintenance
  framework_policy: >
    prefer mature maintained Rust components over custom infrastructure, and
    avoid weakly maintained dependencies across the codebase
task_source:
  tracker: github_issues
  policy: see .agents/decisions/AD-0001 — no issue, no code; branches are
    named <type>/<issue>-<slug> and every PR closes its issue
current_phase:
  phase_id: relay-phase-1
  phase_title: relay phase 1 (CS star topology, self-hosted)
  stage_id: relay-1-node-client
  stage_title: node relay client — persistent link, on-demand streams (issue #32)
current_focus:
  default_task_id: "#32"
  focus_statement: >
    land the node relay client in small steps: (1) persistent outbound
    TLS link to the configured relay (address + pinned fingerprint from
    relay.toml) with reconnect/re-register on the existing reconnect
    worker pattern; (2) open_stream(target_node_id) dialing remote
    nodes through the relay as a PeerConnection so session protocols
    run unmodified; (3) presence events (register/unregister/heartbeat
    timeout) over a structured channel into the console — #36 extends
    that channel for error semantics; SharedState single-writer and
    broadcast_snapshot single-caller rules apply to presence handling
upcoming_focus:
  - config surface relay.toml loading and remote-hosts `via` selector
    (issue #35, unblocked once #32 lands)
  - per-stream window backpressure and fair scheduling (issue #33)
source_of_truth:
  - AGENTS.md
  - docs/relay-design.md
  - .agents/decisions/README.md
  - docs/architecture.md
  - docs/protocol.md
  - docs/remote-node-connection-architecture.md
  - docs/local-acceptance-checklist.md
