id: task.cloud-auth-impl-keyring-secret-store
kind: task
version: 1
title: implement unified OS keyring secret store and migrate existing file secrets
status: in_progress
priority: high
design_ref:
  doc: docs/cloud-host-auth-design.md
  section: 6.3, 9
  why:
    - All local secrets must be stored in the OS keyring with no file fallback.
    - Existing encrypted file secrets must be migrated into the keyring on first run.
source_of_truth:
  file: .agents/tasks/backlog.yaml
  reference: active
depends_on:
  - task.cloud-auth-cert-pinning-design.done
linked_primitives:
  - primitive.verification-refresh
  - primitive.task-board-sync
done_criteria:
  - Introduce a unified SecretStore trait or extend RemoteHostSecretStore with a keyring backend.
  - Implement KeyringSecretStore using an OS keyring crate (Linux secret-service, macOS Keychain, Windows Credential Manager).
  - Migrate operator private key storage from file path to keyring entry.
  - Migrate SSH password and sudo password from FileRemoteHostSecretStore to keyring.
  - On first run after upgrade, migrate existing file secrets into keyring and delete files.
  - If keyring is unavailable, fail with a clear error; no file fallback.
  - All existing tests pass; no new warnings from cargo clippy.
verification:
  - cargo test remote_host_secret_store -- --test-threads=1
  - cargo test operator_auth -- --test-threads=1
  - cargo clippy -- -D warnings
  - manual: verify SSH password and sudo password are read from keyring during Ctrl+W connect
  - manual: verify operator challenge signing reads key from keyring
touched_paths:
  - src/host/ssh/remote_host_secret_store.rs
  - src/infra/operator_auth.rs
  - src/host/ssh/remote_host_connect_runtime.rs
  - src/host/ssh/ssh_remote_host_bootstrapper.rs
  - Cargo.toml
  - Cargo.lock
notes:
  - No export/import command; moving to a new control host requires re-adding credentials.
  - File permissions 0o600 are replaced by OS keyring protection.
