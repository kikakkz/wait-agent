id: context.project
kind: context
version: 1
summary:
  product: WaitAgent
  repo_type: single_crate_rust_repo
  language: rust
  package_manager: cargo
  architecture_style: ratatui_first_workspace_runtime_with_remote_nodes
  active_business_goal: >
    cross-site host interconnect through a self-hosted relay (relay phase 1,
    governed by docs/relay-design.md and .agents/decisions/AD-0002); the
    ratatui-first local runtime and the remote node networking it builds on
    are complete and in maintenance
  framework_policy: >
    prefer mature maintained Rust components over custom infrastructure, and
    avoid weakly maintained dependencies across the codebase
task_source:
  tracker: github_issues
  policy: see .agents/decisions/AD-0001 — no issue, no code; branches are
    named <type>/<issue>-<slug> and every PR closes its issue
current_phase:
  phase_id: relay-phase-1
  phase_title: relay phase 1 (CS star topology, self-hosted)
  stage_id: relay-1-backpressure
  stage_title: per-stream window backpressure and fair scheduling (issue #33)
current_focus:
  default_task_id: "#33"
  focus_statement: >
    per-stream window backpressure and fair scheduling on the relay
    (design-doc Phase-1 task 5): independent window/ack backpressure
    per routed stream with senders honoring per-stream windows, and
    fair scheduling across streams sharing a link so one busy stream
    cannot starve others; lock order must be documented before adding
    locks and no lock may be held while broadcasting or doing I/O;
    verification includes cargo test --release ratatui session_sync,
    clippy, a loom model test for any lock-free path touched, and the
    docker e2e deferred to #37; #32 (node relay client, all three
    steps) is closed and its relay-link-mode mux carries per-stream
    credit already — the relay side passes Window through blindly
upcoming_focus:
  - config surface relay.toml loading and remote-hosts `via` selector
    (issue #35, now fully unblocked: #31, #32, #34 all landed)
  - structured error semantics relay to node to console (issue #36,
    reuses the #32 presence channel)
source_of_truth:
  - AGENTS.md
  - docs/relay-design.md
  - .agents/decisions/README.md
  - docs/architecture.md
  - docs/protocol.md
  - docs/remote-node-connection-architecture.md
  - docs/local-acceptance-checklist.md
