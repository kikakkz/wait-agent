name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # trailer checks walk commit ranges

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: DCO + trailer check on PR commits
        # Check the branch commits (base..head), NOT the checked-out merge
        # commit — GitHub's ephemeral test merge never carries trailers.
        if: github.event_name == 'pull_request'
        run: bash .agents/tools/check-trailers.sh --dco "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: New-surface acceptance check (issue #136)
        # Same check as hooks/pre-commit, over the whole PR range:
        # a new CLI flag / config key / protocol surface needs a
        # scripts/e2e/ change or a registered exemption.
        if: github.event_name == 'pull_request'
        run: python3 .agents/tools/check_surface_e2e.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo build
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo build (debug binary for tests)
        run: cargo build

      - name: cargo test
        run: cargo test --bin waitagent -- --test-threads=1

  # Relay docker e2e (issue #37). Not a required context yet: the harness
  # rides alongside the suite until its stability is proven on CI runners.
  e2e-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo build (release binary for the e2e image)
        run: cargo build --release

      - name: relay docker e2e (isolated topology)
        run: WA_E2E_BINARY=target/release/waitagent scripts/e2e/relay/e2e-relay.sh

  # WebUI e2e (issue #131 slice 4, AGENTS.md constraint #6). Loopback-only,
  # no docker: real relay + web processes with a stub SMTP server. Same
  # observation-mode status as e2e-relay while runner stability is proven.
  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo build (release binary for the e2e)
        run: cargo build --release

      - name: web e2e (loopback processes + stub SMTP)
        run: WA_E2E_BINARY=target/release/waitagent scripts/e2e/web/e2e-web.sh

  # Install-source docker e2e (issue #168, AGENTS.md constraint #6): a real
  # sshd host on an internal docker network proves the LocalUpload install
  # source end to end (artifact upload over SSH exec, remote install, node
  # start) and that a primed cache is reused without re-downloading. Same
  # observation-mode status as e2e-relay while runner stability is proven.
  e2e-ssh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison pkg-config libevent-dev libncurses-dev \
            build-essential automake autoconf \
            libdbus-1-dev libkeyutils-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo build (release binary for the e2e image)
        run: cargo build --release

      - name: ssh install-source docker e2e (internal network)
        run: WA_E2E_BINARY=target/release/waitagent scripts/e2e/ssh-install/e2e-ssh-install.sh

  windows-check:
    runs-on: windows-latest
    env:
      # Default CARGO_BUILD_JOBS=1 makes the Windows build impractically slow.
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: cargo check (Windows target)
        run: cargo check --all-targets

      - name: cargo clippy (Windows)
        run: cargo clippy -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  windows-test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo test (release)
        run: cargo test --release -- --test-threads=1

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          brew install bison pkg-config libevent ncurses automake autoconf utf8proc

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo check
        run: cargo check --all-targets
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/ncurses/lib/pkgconfig:/opt/homebrew/opt/libevent/lib/pkgconfig:/opt/homebrew/opt/utf8proc/lib/pkgconfig

  ai-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check .agents/ control plane integrity
        run: make ai-check
